<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Custom | Cyber Focus</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <!-- Custom Style dari Root Project -->
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background-color: #0a0813;
            color: #f8f9fa;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* CUSTOM SCROLLBAR WARNA UNGU NEON */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0813;
        }

        ::-webkit-scrollbar-thumb {
            background: #9d4edd;
            border-radius: 5px;
            box-shadow: 0 0 10px #c77dff;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c77dff;
        }

        /* Penyesuaian Navbar Agar Tombol Kembali Berada di Kanan Persis Seperti Album */
        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-back-nav {
            margin-left: auto;
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.85rem;
        }

        .timer-card {
            background: #130f24;
            border: 2px solid rgba(157, 78, 221, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.25);
            max-width: 520px;
            margin: 0 auto;
        }

        /* Hapus panah naik-turun pada input number */
        .input-custom {
            background: #0a0813;
            border: 1px solid #9d4edd;
            color: #c77dff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 10px;
            padding: 8px;
            max-width: 120px;
            -moz-appearance: textfield;
        }

        .input-custom::-webkit-outer-spin-button,
        .input-custom::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-custom:focus {
            background: #0a0813;
            color: #fff;
            border-color: #c77dff;
            box-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
            outline: none;
        }

        .btn-set {
            background: #9d4edd;
            border: 1px solid #c77dff;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-radius: 10px;
            padding: 8px 18px;
            transition: all 0.3s ease;
        }

        .btn-set:hover {
            background: #c77dff;
            color: #0a0813;
            box-shadow: 0 0 12px #c77dff;
        }

        .preset-btn {
            background: transparent;
            border: 1px solid rgba(199, 125, 255, 0.3);
            color: #a0a0b8;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            border-color: #c77dff;
            color: #fff;
            background: rgba(157, 78, 221, 0.2);
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            color: #c77dff;
            text-shadow: 0 0 20px rgba(199, 125, 255, 0.6);
            margin: 20px 0;
            letter-spacing: 2px;
        }

        .control-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            padding: 12px 30px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #5a189a, #9d4edd);
            border: 1px solid #c77dff;
            color: #fff;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }

        .btn-start:hover {
            box-shadow: 0 0 25px rgba(199, 125, 255, 0.7);
            color: #fff;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8f9fa;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .status-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* CUSTOM MODAL POPUP STYLING */
        .modal-cyber {
            background: #130f24;
            border: 2px solid #c77dff;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(199, 125, 255, 0.4);
            color: #fff;
        }

        .modal-cyber .modal-header,
        .modal-cyber .modal-footer {
            border: none;
        }

        .cyber-icon-glow {
            font-size: 4rem;
            color: #00f5d4;
            text-shadow: 0 0 20px #00f5d4;
        }
    </style>
</head>
<body>

    <!-- BACKGROUND GLOW -->
    <div class="bg-glow"></div>

    <!-- NAVBAR HEADER -->
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="logo" style="cursor: default;">
                <i class="fa-solid fa-gamepad"></i> PORT<span>FOLIO</span>
            </div>
            <a href="../index.html#features" class="btn btn-outline btn-back-nav">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </a>
        </div>
    </nav>

    <!-- KONTEN UTAMA TIMER -->
    <main class="container my-auto py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-white display-5" style="font-family: 'Orbitron', sans-serif;">
                <i class="fa-solid fa-stopwatch text-purple"></i> CUSTOM <span style="color: #c77dff;">TIMER</span>
            </h1>
            <p class="text-white-50 fs-5">Atur durasi waktu sesuai dengan kebutuhan sesi fokus kamu.</p>
        </div>

        <!-- CARD TIMER -->
        <div class="timer-card p-4 p-md-5 text-center">
            
            <!-- INPUT CUSTOM WAKTU -->
            <label class="text-white-50 small mb-2 d-block" style="font-family: 'Orbitron', sans-serif;">
                <i class="fa-solid fa-sliders text-purple me-1"></i> Masukkan Menit:
            </label>
            <div class="d-flex justify-content-center gap-2 mb-3">
                <input type="number" id="custom-minutes" class="form-control input-custom" value="25" min="0.1" step="any">
                <button class="btn btn-set" onclick="setCustomTime()">
                    <i class="fa-solid fa-check me-1"></i> Terapkan
                </button>
            </div>

            <!-- PRESET INSTAN -->
            <div class="d-flex justify-content-center gap-2 mb-3 flex-wrap">
                <button class="preset-btn" onclick="quickSet(0.5)">30 dtk</button>
                <button class="preset-btn" onclick="quickSet(5)">5m</button>
                <button class="preset-btn" onclick="quickSet(15)">15m</button>
                <button class="preset-btn" onclick="quickSet(25)">25m</button>
                <button class="preset-btn" onclick="quickSet(60)">60m</button>
            </div>

            <!-- STATUS BADGE -->
            <div class="my-3">
                <span class="badge bg-dark border border-secondary text-info px-3 py-2 status-badge" id="status-text">
                    <i class="fa-solid fa-hourglass-half me-1"></i> Sesi Kustom
                </span>
            </div>

            <!-- DISPLAY ANGKA TIMER -->
            <div class="timer-display" id="time-display">25:00</div>

            <!-- KONTROL TOMBOL -->
            <div class="d-flex justify-content-center gap-3">
                <button class="btn control-btn btn-start" id="start-btn" onclick="toggleTimer()">
                    <i class="fa-solid fa-play me-2"></i> Mulai
                </button>
                <button class="btn control-btn btn-reset" onclick="resetTimer()">
                    <i class="fa-solid fa-rotate-right me-2"></i> Reset
                </button>
            </div>
        </div>
    </main>

    <!-- MODAL POPUP SELESAI -->
    <div class="modal fade" id="finishModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-cyber text-center p-3">
                <div class="modal-header justify-content-center">
                    <h4 class="modal-title fw-bold" style="font-family: 'Orbitron', sans-serif; color: #c77dff;">
                        <i class="fa-solid fa-trophy text-warning me-2"></i> WAKTU HABIS!
                    </h4>
                </div>
                <div class="modal-body">
                    <div class="my-3">
                        <i class="fa-solid fa-bell-concierge cyber-icon-glow"></i>
                    </div>
                    <p class="fs-5 text-white-50">Sesi fokus kamu telah selesai. Saatnya istirahat sejenak!</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-set px-4 py-2" onclick="stopAlarmAndCloseModal()">
                        <i class="fa-solid fa-check me-2"></i> Mantap, Mengerti!
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer mt-auto py-3 text-center border-top border-secondary border-opacity-10">
        <div class="container">
            <p>© 2026 Portofolio Developer.</p>
        </div>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
    <script src="script.js"></script>
</body>
</html>
