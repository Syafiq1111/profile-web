<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tic-Tac-Toe Custom | Minigames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">

    <style>
        body {
            background-color: #0a0813;
            color: #f8f9fa;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0813;
        }

        ::-webkit-scrollbar-thumb {
            background: #9d4edd;
            border-radius: 5px;
            box-shadow: 0 0 10px #c77dff;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #c77dff;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
        }

        .btn-back-nav {
            margin-left: auto;
            border-radius: 50px;
            padding: 6px 18px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .game-card {
            background: #130f24;
            border: 2px solid rgba(157, 78, 221, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.25);
            max-width: 550px;
            margin: 0 auto;
        }

        .setting-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #a0a0b8;
            margin-bottom: 5px;
            display: block;
            text-align: left;
        }

        .select-cyber {
            background-color: #0a0813;
            border: 1px solid #9d4edd;
            color: #c77dff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-radius: 10px;
            padding: 8px 12px;
        }

        .select-cyber:focus {
            background-color: #0a0813;
            color: #fff;
            border-color: #c77dff;
            box-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
            outline: none;
        }

        .tictactoe-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .cell {
            aspect-ratio: 1;
            background: #0a0813;
            border: 2px solid rgba(157, 78, 221, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            user-select: none;
        }

        .cell:hover {
            border-color: #c77dff;
            background: rgba(157, 78, 221, 0.1);
            box-shadow: 0 0 15px rgba(199, 125, 255, 0.3);
            transform: scale(1.03);
        }

        .cell.x {
            color: #00f5d4;
            text-shadow: 0 0 15px rgba(0, 245, 212, 0.7);
        }

        .cell.o {
            color: #ff4d6d;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.7);
        }

        .cell.win {
            background: rgba(199, 125, 255, 0.25);
            border-color: #c77dff;
            box-shadow: 0 0 25px #c77dff;
            animation: pulse-win 0.8s infinite alternate;
        }

        @keyframes pulse-win {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(10, 8, 19, 0.6);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
        }

        .score-item span {
            display: block;
            font-size: 1.3rem;
            font-weight: 800;
            color: #c77dff;
        }

        .status-box {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: #00f5d4;
            text-shadow: 0 0 8px rgba(0, 245, 212, 0.4);
            margin-bottom: 20px;
        }

        .btn-cyber {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-radius: 10px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: rgba(255, 77, 109, 0.15);
            border: 1px solid #ff4d6d;
            color: #ff758f;
            width: 100%;
        }

        .btn-reset:hover {
            background: #ff4d6d;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- NAVBAR HEADER -->
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="logo" style="cursor: default;">
                <i class="fa-solid fa-gamepad"></i> PORT<span>FOLIO</span>
            </div>
            <a href="../index.html" class="btn btn-outline btn-back-nav">
                <i class="fa-solid fa-arrow-left"></i> Kembali
            </a>
        </div>
    </nav>

    <!-- KONTEN UTAMA TIC-TAC-TOE -->
    <main class="container my-auto py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-white display-5" style="font-family: 'Orbitron', sans-serif;">
                <i class="fa-solid fa-robot text-purple"></i> CYBER <span style="color: #c77dff;">TIC-TAC-TOE AI</span>
            </h1>
            <p class="text-white-50 fs-5">Atur ukuran papan, deret kemenangan, dan tingkat kesulitan AI sesuai keinginanmu.</p>
        </div>

        <!-- CARD GAME -->
        <div class="game-card p-4 p-md-4 text-center">
            
            <!-- PENGATURAN GRID & LEVEL -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="setting-label">Ukuran Papan:</label>
                    <select id="grid-size" class="form-select select-cyber" onchange="changeSettings()">
                        <option value="3" selected>3 x 3 (Deret 3)</option>
                        <option value="4">4 x 4 (Deret 4)</option>
                        <option value="5">5 x 5 (Deret 4)</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="setting-label">Level AI:</label>
                    <select id="ai-difficulty" class="form-select select-cyber">
                        <option value="easy">Mudah (Easy)</option>
                        <option value="medium" selected>Normal (Medium)</option>
                        <option value="hard">Sulit (Hard)</option>
                    </select>
                </div>
            </div>

            <!-- SKOR -->
            <div class="score-board">
                <div class="score-item">
                    Kamu (X) <span id="score-x">0</span>
                </div>
                <div class="score-item">
                    Seri <span id="score-draw">0</span>
                </div>
                <div class="score-item">
                    AI (O) <span id="score-o">0</span>
                </div>
            </div>

            <!-- STATUS GILIRAN -->
            <div class="status-box" id="game-status">
                <i class="fa-solid fa-play me-1"></i> Giliran Kamu (X)
            </div>

            <!-- GRID PAPAN DINAMIS -->
            <div class="tictactoe-grid" id="board"></div>

            <!-- TOMBOL RESET -->
            <button class="btn btn-cyber btn-reset" onclick="resetBoard()">
                <i class="fa-solid fa-rotate-right me-1"></i> Reset Papan
            </button>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer mt-auto py-3 text-center border-top border-secondary border-opacity-10">
        <div class="container">
            <p>© 2026 Portofolio Developer.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../script.js"></script>
    <script src="script.js"></script>
</body>
</html>
